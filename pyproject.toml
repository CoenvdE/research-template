[project]
name = "research-template"
version = "0.1.0"
description = "PyTorch Lightning research template: correctness guardrails, performance callbacks, and a Claude-collaborative workflow"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "lightning>=2.4",
    "jsonargparse[signatures]>=4.32",
    "numpy>=1.26",
    "wandb>=0.17",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running tests, excluded from CI",
    "gpu: tests requiring a GPU",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
