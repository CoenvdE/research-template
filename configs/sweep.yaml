# wandb sweep template (present when you need it; harmless otherwise).
# Usage:
#   wandb sweep configs/sweep.yaml        # prints a sweep id
#   wandb agent <entity>/<project>/<id>   # run one agent per GPU/machine
# The agent appends parameters as --model.lr=... flags, which LightningCLI
# accepts natively, so no glue code is needed.
program: src/train.py
method: bayes
metric:
  name: val/loss
  goal: minimize
parameters:
  model.lr:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 1.0e-2
  model.hidden_dim:
    values: [32, 64, 128]
  model.warmup_frac:
    values: [0.02, 0.05, 0.1]
command:
  - ${env}
  - python
  - -m
  - src.train
  - fit
  - --config
  - configs/base.yaml
  - --config
  - configs/experiment/wandb.yaml
  - ${args}
